<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloco de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="janela-app">
    <div class="barra-janela">
      <div class="botoes-janela">
        <span class="botao-fechar"></span>
        <span class="botao-minimizar"></span>
        <span class="botao-expandir"></span>
      </div>
      <span class="titulo-janela">Minha Lista de Tarefas</span>
    </div>

    <div class="conteudo-app">
      <div class="input-group">
        <input type="text" id="txtTarefa" placeholder="Adicionar tarefa">
        <button type="button" id="btnAdicionar">Anotar</button>
      </div>

      <ul id="lstTarefas"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
